spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/timetracker
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always

mybatis:
  mapper-locations: classpath:/mappers/*.xml
  type-aliases-package: org.example.Entity
  configuration:
    map-underscore-to-camel-case: true